<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Anti-flash: apply theme before React mounts -->
    <script src="/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>AthithiGriha — Discover Extraordinary Hotel Stays</title>
    <meta name="description" content="Book luxury hotels and private residences worldwide with AthithiGriha's seamless concierge-driven booking experience. Curated stays, best price guarantee, 24/7 concierge." />
    <meta name="keywords" content="luxury hotels, hotel booking, luxury stays, private residences, boutique hotels, AthithiGriha, hotel deals" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://hotel-management-frontend-puce.vercel.app" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AthithiGriha" />
    <meta property="og:title" content="AthithiGriha — Discover Extraordinary Hotel Stays" />
    <meta property="og:description" content="Curated luxury hotels and private residences with seamless concierge-driven booking. Best price guarantee and 24/7 support." />
    <meta property="og:url" content="https://hotel-management-frontend-puce.vercel.app" />
    <meta property="og:image" content="https://hotel-management-frontend-puce.vercel.app/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AthithiGriha — Discover Extraordinary Hotel Stays" />
    <meta name="twitter:description" content="Curated luxury hotels with seamless booking. Best price guarantee and 24/7 concierge." />
    <meta name="twitter:image" content="https://hotel-management-frontend-puce.vercel.app/og-image.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "AthithiGriha",
      "description": "Curated luxury hotel booking platform with seamless concierge-driven experience.",
      "url": "https://hotel-management-frontend-puce.vercel.app",
      "logo": "https://hotel-management-frontend-puce.vercel.app/logo.png",
      "sameAs": [
        "https://facebook.com",
        "https://twitter.com",
        "https://instagram.com",
        "https://linkedin.com"
      ]
    }
    </script>

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://checkout.razorpay.com" />
    <link rel="preconnect" href="https://cdn.razorpay.com" />
    <link rel="preconnect" href="https://api.razorpay.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous" />
    
    <!-- Content Security Policy (CSP) for enhanced protection against XSS and injection attacks -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://checkout.razorpay.com https://cdn.razorpay.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.vercel.app wss://*.vercel.app https://*.up.railway.app wss://*.up.railway.app https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com https://cdn.razorpay.com https://countriesnow.space https://ipapi.co https://freeipapi.com ws://localhost:* http://localhost:*; frame-src 'self' https://accounts.google.com https://checkout.razorpay.com https://cdn.razorpay.com https://api.razorpay.com https://maps.google.com https://www.google.com;" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
